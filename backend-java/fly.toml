# Backend Java no Fly.io.
#
# Por que sair da Vercel: la o backend roda como container service que escala
# para zero, e nao ha como desligar isso - o schema oficial do vercel.json nao
# tem minInstances, scaling nem alwaysOn. Toda visita depois do periodo ocioso
# pagava o boot completo da JVM: medido em producao, 16.832 ms na primeira
# requisicao contra 193 ms nas seguintes.
#
# Aqui `min_machines_running = 1` mantem uma maquina de pe. O cold start deixa
# de existir em vez de ser mascarado por ping externo - que, alem de fragil,
# nao resolvia o caso de a plataforma criar uma instancia nova.

app = 'cidadao-informa-api'

# ATENCAO: escolha a regiao onde esta o banco, nao onde estao os usuarios.
# Cada query e uma ida e volta ate o Postgres, entÃ£o app e banco na mesma
# regiao vale mais que app perto do navegador. Leia o host do
# SPRING_DATASOURCE_URL: `aws-0-sa-east-1.pooler.supabase.com` -> use 'gru'
# (Sao Paulo); `aws-0-us-east-1...` -> use 'iad' (Virginia).
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  PORT = '8080'
  CORS_ALLOWED_ORIGINS = 'https://cidadao-informa.vercel.app'
  LOGIN_RATE_LIMIT_MAX_FAILURES_PER_IP = '30'
  LOGIN_RATE_LIMIT_MAX_FAILURES_PER_CPF = '10'
  LOGIN_RATE_LIMIT_WINDOW_MINUTES = '15'
  # Uma conexao viva no pool, para nao repetir handshake TLS + auth no pooler
  # do Supabase a cada periodo ocioso.
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  # 'off' e o que impede a maquina de dormir. Com auto_stop ligado o Fly
  # reproduziria exatamente o problema que estamos saindo da Vercel para evitar.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 40
    hard_limit = 60

# grace_period generoso: o Spring Boot leva alguns segundos para subir e o
# health check nao deve derrubar a maquina durante o proprio boot.
[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '60s'
  method = 'GET'
  path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  # 256mb nao basta para Spring Boot com Hibernate e pool de conexoes.
  memory = '512mb'

# O schema de producao deve ser migrado de forma controlada antes do deploy.
# Repetir Flyway e a validacao completa do Hibernate em todo cold start torna a
# primeira requisicao sensivelmente mais lenta no container efemero da Vercel.
spring:
  main:
    banner-mode: off
  datasource:
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      idle-timeout: 30000
      keepalive-time: 0
      connection-timeout: 10000
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  jmx:
    enabled: false

# A documentacao continua disponivel localmente. Em producao ela nao precisa
# criar controllers e modelos OpenAPI durante a inicializacao do backend.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  scheduling:
    enabled: false

server:
  port: ${PORT:${SERVER_PORT:5206}}

spring:
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      # Uma conexao viva no pool. Com minimum-idle 0 o Hikari fechava tudo no
      # periodo ocioso e a proxima requisicao pagava handshake TLS + auth no
      # pooler do Supabase de novo: medido em producao, /api/health custava
      # 516ms na primeira chamada e 192ms na seguinte.
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      # Recicla a conexao antes de o pooler do Supabase derrubar por idle.
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:150000}
  data:
    jpa:
      repositories:
        bootstrap-mode: ${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:default}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

springdoc:
  api-docs:
    path: /swagger/v3/api-docs
  swagger-ui:
    path: /swagger

app:
  cron:
    secret: ${CRON_SECRET:}
  protocol-events:
    poll-ms: ${PROTOCOL_EVENTS_POLL_MS:1000}
    heartbeat-ms: ${PROTOCOL_EVENTS_HEARTBEAT_MS:25000}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  security:
    login-rate-limit:
      max-failures-per-ip: ${LOGIN_RATE_LIMIT_MAX_FAILURES_PER_IP:30}
      max-failures-per-cpf: ${LOGIN_RATE_LIMIT_MAX_FAILURES_PER_CPF:10}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  supabase:
    edge-function-url: ${SUPABASE_EDGE_FUNCTION_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    corrected-image-function-url: ${SUPABASE_CORRECTED_IMAGE_FUNCTION_URL:}
    chat-function-url: ${SUPABASE_CHAT_FUNCTION_URL:}
  ai:
    image-function-secret: ${AI_IMAGE_FUNCTION_SECRET:${SUPABASE_ANON_KEY}}
    chat:
      primary-model: ${AI_CHAT_PRIMARY_MODEL:google/gemini-3.7-flash}
      economy-model: ${AI_CHAT_ECONOMY_MODEL:google/gemini-2.5-flash-lite}
      response-cache-ttl-seconds: ${AI_CHAT_RESPONSE_CACHE_TTL_SECONDS:300}
    chat-cache:
      enabled: ${AI_CHAT_CACHE_ENABLED:true}
      ttl-days: ${AI_CHAT_CACHE_TTL_DAYS:30}
      max-candidates: ${AI_CHAT_CACHE_MAX_CANDIDATES:200}
      similarity-threshold: ${AI_CHAT_CACHE_SIMILARITY_THRESHOLD:0.88}
      strict-similarity-threshold: ${AI_CHAT_CACHE_STRICT_SIMILARITY_THRESHOLD:0.94}
    limits:
      requests-per-minute: ${AI_CHAT_REQUESTS_PER_MINUTE:6}
      requests-per-hour: ${AI_CHAT_REQUESTS_PER_HOUR:10}
      requests-per-day: ${AI_CHAT_REQUESTS_PER_DAY:30}
      tokens-per-day: ${AI_CHAT_TOKENS_PER_DAY:50000}
      concurrent-requests: ${AI_CHAT_CONCURRENT_REQUESTS:2}
    billing:
      # Reserva curta para impedir chamadas concorrentes acima do saldo. Ao fim,
      # somente o custo real devolvido pelo OpenRouter permanece debitado.
      chat-reservation-brl: ${AI_CHAT_RESERVATION_BRL:0.10}
      usd-to-brl-rate: ${AI_USD_TO_BRL_RATE:5.50}
      markup-percent: ${AI_MARKUP_PERCENT:20.00}
      minimum-top-up-brl: ${AI_MINIMUM_TOP_UP_BRL:10.00}

server:
  port: ${PORT:${SERVER_PORT:5206}}

spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

springdoc:
  api-docs:
    path: /swagger/v3/api-docs
  swagger-ui:
    path: /swagger

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  supabase:
    edge-function-url: ${SUPABASE_EDGE_FUNCTION_URL}
    anon-key: ${SUPABASE_ANON_KEY}

server:
  port: ${PORT:${SERVER_PORT:5206}}

spring:
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      # Uma conexao viva no pool. Com minimum-idle 0 o Hikari fechava tudo no
      # periodo ocioso e a proxima requisicao pagava handshake TLS + auth no
      # pooler do Supabase de novo: medido em producao, /api/health custava
      # 516ms na primeira chamada e 192ms na seguinte.
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      # Recicla a conexao antes de o pooler do Supabase derrubar por idle.
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:150000}
  data:
    jpa:
      repositories:
        bootstrap-mode: ${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:default}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

springdoc:
  api-docs:
    path: /swagger/v3/api-docs
  swagger-ui:
    path: /swagger

app:
  cron:
    secret: ${CRON_SECRET:}
  protocol-events:
    poll-ms: ${PROTOCOL_EVENTS_POLL_MS:1000}
    heartbeat-ms: ${PROTOCOL_EVENTS_HEARTBEAT_MS:25000}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  security:
    login-rate-limit:
      max-failures-per-ip: ${LOGIN_RATE_LIMIT_MAX_FAILURES_PER_IP:30}
      max-failures-per-cpf: ${LOGIN_RATE_LIMIT_MAX_FAILURES_PER_CPF:10}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  supabase:
    edge-function-url: ${SUPABASE_EDGE_FUNCTION_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    corrected-image-function-url: ${SUPABASE_CORRECTED_IMAGE_FUNCTION_URL:}
    chat-function-url: ${SUPABASE_CHAT_FUNCTION_URL:}
  ai:
    image-function-secret: ${AI_IMAGE_FUNCTION_SECRET:${SUPABASE_ANON_KEY}}

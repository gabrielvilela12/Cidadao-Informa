    <style>
      .ui { font-family: "Public Sans", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 56px; font-weight: 900; letter-spacing: 0; fill: #071a3a; }
      .title-gold { fill: #8a6100; }
      .body { font-size: 16px; font-weight: 600; fill: #5d6370; }
      .badge { font-size: 14px; font-weight: 900; letter-spacing: .35px; fill: #071a3a; }
      .small { font-size: 14px; font-weight: 900; fill: #1d2633; }
      .tiny { font-size: 11px; font-weight: 900; fill: #5b6472; }
      .footer { font-size: 15px; font-weight: 900; fill: #202b3a; }
      .inverse { fill: #fff; }
      .float-soft { animation: floatSoft 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float-alt { animation: floatSoft 7.2s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
      .pin-pulse { animation: pinPulse 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .flow-line { animation: dashFlow 12s linear infinite; }
      .flow-dot { animation: dotPulse 2.6s ease-in-out infinite; }
      .draw-check { stroke-dasharray: 54; stroke-dashoffset: 54; animation: drawCheck 3.5s ease-in-out infinite; }
      .progress-fill { transform-box: fill-box; transform-origin: left center; animation: progressGrow 4.5s ease-in-out infinite; }
      @keyframes floatSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes pinPulse { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.055); } }
      @keyframes dashFlow { to { stroke-dashoffset: -120; } }
      @keyframes dotPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes drawCheck { 0%, 35% { stroke-dashoffset: 54; } 55%, 100% { stroke-dashoffset: 0; } }
      @keyframes progressGrow { 0%, 100% { transform: scaleX(.68); } 45%, 70% { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .float-soft, .float-alt, .pin-pulse, .flow-line, .flow-dot, .draw-check, .progress-fill { animation: none; }
        .draw-check { stroke-dashoffset: 0; }
      }
    </style>

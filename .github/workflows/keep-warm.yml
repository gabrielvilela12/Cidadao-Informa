# Mantem o backend Java aquecido.
#
# O backend roda como container service na Vercel (ver vercel.json) e escala
# para zero quando ninguem usa o site. A primeira visita depois do periodo
# ocioso paga o boot inteiro: JVM, contexto Spring, Flyway, Hibernate e a
# primeira conexao no pooler do Supabase. Medido em producao: 17s na primeira
# requisicao contra ~200ms nas seguintes, com 6 protocolos na base.
#
# Por que um laco dentro de UMA execucao horaria, e nao um cron de 5 minutos:
# a primeira versao usava `*/5` e nao executou nenhuma vez em 29 minutos. O
# GitHub atrasa e descarta agendamentos de alta frequencia - a propria
# documentacao avisa isso. Agendamento de hora em hora e bem mais respeitado,
# e o laco interno cobre o intervalo pingando a cada 60s, granularidade que
# nenhum cron gratuito ofereceria. Se o gatilho de uma hora atrasar, perde-se
# aquecimento naquele intervalo, nao a cada 5 minutos.
#
# /api/health executa `SELECT 1`, entao o ping aquece tambem a conexao do
# Hikari - nao so o processo Java.
#
# Repositorio publico: minutos de Actions nao sao cobrados, então as ~55
# execucoes de curl por hora saem de graca.
name: keep-warm

on:
  schedule:
    # No minuto 0 de cada hora. O laco do job cobre os 55 minutos seguintes.
    - cron: '0 * * * *'
  workflow_dispatch:

# A execucao nova substitui a anterior: sem isto, um job de 55 minutos ainda
# rodando faria o gatilho da hora seguinte ficar na fila sem aquecer nada.
concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Aquecer /api/health por ~55 minutos
        env:
          # Sobrescreva com a variavel de repositorio APP_BASE_URL se o dominio mudar.
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://cidadao-informa.vercel.app' }}
          # 55 pings de 60s. Deixa folga para o gatilho da hora seguinte.
          ROUNDS: '55'
          INTERVAL_SECONDS: '60'
        run: |
          set -u
          base="${BASE_URL%/}"

          # /api/health faz SELECT 1: aquece o processo e a conexao do Hikari.
          # /api/protocols/stats e publica e roda tres queries de contagem pelo
          # Spring Data: aquece o JPA. Medido em producao, a primeira chamada
          # dela custava 2,7s mesmo com /api/health ja respondendo em 193ms.
          paths="/api/health /api/protocols/stats"

          ok=0
          fail=0
          slowest=0

          echo "aquecendo $base | $ROUNDS rodadas a cada ${INTERVAL_SECONDS}s"

          for round in $(seq 1 "$ROUNDS"); do
            for path in $paths; do
              start=$(date +%s%3N)
              # A atribuicao herda o status do curl: em falha de rede o proprio
              # %{http_code} ja imprime 000, então normalizamos para um valor so.
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$base$path") || code=000
              elapsed=$(( $(date +%s%3N) - start ))

              if [ "$code" = "200" ]; then
                ok=$(( ok + 1 ))
                [ "$elapsed" -gt "$slowest" ] && slowest=$elapsed
                # Acima de 3s significa que o container esfriou entre os pings:
                # sinal de que o intervalo precisa encurtar.
                if [ "$elapsed" -gt 3000 ]; then
                  echo "rodada $round/$ROUNDS $path: 200 em ${elapsed}ms - LENTO, tinha esfriado"
                else
                  echo "rodada $round/$ROUNDS $path: 200 em ${elapsed}ms"
                fi
              else
                fail=$(( fail + 1 ))
                echo "rodada $round/$ROUNDS $path: http=$code em ${elapsed}ms - FALHOU"
              fi
            done

            # Uma falha isolada nao deve interromper o aquecimento das rodadas
            # seguintes; o veredito fica para o resumo no fim.
            [ "$round" -lt "$ROUNDS" ] && sleep "$INTERVAL_SECONDS"
          done

          echo "resumo: $ok ok, $fail falhas, pior tempo ${slowest}ms"

          if [ "$ok" -eq 0 ]; then
            echo "::error::nenhum ping respondeu 200 ($base)"
            exit 1
          fi

          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail pings falharam"
          fi
